# Replace domain, installation path and PHP socket for your hosting.
# Add HTTPS via your hosting provider before production use.
server {
    listen 80;
    server_name example.com;
    root /var/www/print-studio/public;
    index index.php;
    charset utf-8;
    client_max_body_size 64m;
    add_header X-Content-Type-Options nosniff always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ ^/storage/.*\.(?:php|phtml|phar|cgi|pl|sh)(?:/|$) { deny all; }
    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.(?:php|phtml|phar)$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
